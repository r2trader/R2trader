name: R2trader research (all strategies)
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches: [main]
    paths: ["src/lab.py", "src/research_all.py", ".github/workflows/research_all.yml"]
permissions:
  contents: write
concurrency:
  group: r2trader-research-all
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/research_all.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_all.json
          git diff --cached --quiet || (git commit -m "Update research results" && git pull --rebase && git push)
