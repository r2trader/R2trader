name: R2trader FibMA research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/research_fibma.py", ".github/workflows/research_fibma.yml"]
permissions:
  contents: write
concurrency:
  group: r2trader-research-fibma
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/research_fibma.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_fibma.json
          git diff --cached --quiet || (git commit -m "Update FibMA research results" && git pull --rebase && git push)
