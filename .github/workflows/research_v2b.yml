name: R2trader research v2 main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/research_v2b.py", ".github/workflows/research_v2b.yml"]
permissions:
  contents: write
concurrency:
  group: r2trader-research-v2b
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/research_v2b.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_v2_main.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update research v2 main results"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep $((i * 5))
          done
          exit 1
