name: R2trader lab research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/lab.py", ".github/workflows/research_lab.yml"]
permissions:
  contents: write
concurrency:
  group: r2trader-research-lab
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/lab.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_lab.json
          git diff --cached --quiet || (git commit -m "Update lab research results" && git pull --rebase && git push)
